<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Game Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pokémon Game Tracker</h1>
        <nav>
            <button id="home-btn">Overview</button>
            <div id="gen-buttons"></div>
        </nav>
    </header>
    
    <main>
        <!-- Overview Homepage with Master Grid & Covers -->
        <section id="summary-view">
            <h2>Collection Summary</h2>
            <div class="stats">
                <div class="stat-box" id="collected-stat">Items Owned: 0</div>
                <div class="stat-box" id="missing-stat">Items Missing: 0</div>
            </div>
            
            <h3>All Games Collection Status</h3>
            <p class="subtitle">Click any game card or visit generation tabs to manage variant conditions.</p>
            <div id="master-grid" class="grid"></div>
        </section>

        <!-- Generation Detail View -->
        <section id="gen-view" class="hidden">
            <h2 id="current-gen-title">Generation</h2>
            <div id="games-list" class="grid"></div>
        </section>
    </main>

    <script src="script.js?v=11"></script>
</body>
</html>
